[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mario-search"
version = "0.1.0"
description = "Save-state best-first search for the original NES Super Mario Bros."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}
authors = [{name = "kzoacn"}]
dependencies = [
    "setuptools==80.9.0", # Legacy Gym imports distutils on Python 3.12.
    "numpy==1.26.4",
    "gym==0.23.1",
    "gym-super-mario-bros==7.3.2",
    "nes-py==8.2.1",
    "opencv-python-headless==4.11.0.86",
    "pyglet==1.5.21",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
mario-search = "mario_search.cli:main"

[tool.setuptools]
packages = ["mario_search"]
license-files = ["LICENSE", "third_party/*.LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
